<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول الأدمن | الكانتين والمكتبة</title>
<link rel="icon" href="cross (2).png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin-style.css">
</head>
<body class="admin-body">
<div class="back-home-container">
    <a href="index.html" class="back-home-btn">
        <i class="fas fa-arrow-right"></i> العودة  👈
    </a>
</div>
<div class="login-card">
  <img src="cross (2).png" alt="صليب قبطي" class="login-cross">
  <h1>تسجيل دخول الأدمن</h1>
  <p class="login-sub">لوحة تحكم الكانتين والمكتبة</p>

  <form id="loginForm">
    <label for="username">اسم المستخدم</label>
    <input type="text" id="username" required autocomplete="username">

    <label for="password">كلمة السر</label>
    <input type="password" id="password" required autocomplete="current-password">

    <p class="error-msg" id="errorMsg"></p>

    <button type="submit" id="loginBtn">دخول</button>
  </form>
</div>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="admin-auth.js"></script>
</body>
</html>
